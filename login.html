<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 기록 저장하기 - 스마트폰 AI 배움터</title>
  <meta name="description" content="이름과 숫자 4자리로 배운 기록을 저장해요.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://silver-ai-school.onrender.com/login.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="어르신을 위한 스마트폰 AI 배움터">
  <meta property="og:title" content="내 기록 저장하기 - 스마트폰 AI 배움터">
  <meta property="og:description" content="이름과 숫자 4자리로 배운 기록을 저장해요.">
  <meta property="og:url" content="https://silver-ai-school.onrender.com/login.html">
  <meta property="og:image" content="https://silver-ai-school.onrender.com/images/og.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-input {
      width: 100%; font-size: 1.4rem; font-family: inherit; padding: 16px 18px;
      border: 3px solid var(--border); border-radius: 18px; min-height: 72px; margin-top: 8px;
    }
    .login-input:focus { outline: none; border-color: var(--primary); }
    .pin-display { display: flex; justify-content: center; gap: 14px; margin: 12px 0 18px; }
    .pin-dot {
      width: 56px; height: 72px; border: 3px solid var(--border); border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; background: #fff;
    }
    .pin-dot.filled { border-color: var(--primary); background: var(--primary-light); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .keypad button {
      min-height: 76px; font-size: 1.7rem; font-weight: 700; font-family: inherit;
      border: 3px solid var(--border); border-radius: 18px; background: #fff; cursor: pointer;
    }
    .keypad button:active { background: var(--primary-light); }
    .keypad .del { font-size: 1.2rem; color: var(--text-sub); }
    .msg { text-align: center; font-weight: 700; margin: 14px 0; min-height: 1.6em; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: #22683d; }
  </style>
</head>
<body>
  <header class="topbar"></header>

  <main class="container">
    <div class="card">
      <p class="step-title" style="text-align:center">📒 내 기록 저장하기</p>
      <p class="sub" style="text-align:center">이름과 숫자 4자리만 정하면,<br>다른 휴대폰에서도 어디까지 배웠는지 이어서 볼 수 있어요.</p>

      <h3>1. 이름 (또는 별명)</h3>
      <input class="login-input" id="name" placeholder="예: 김영희" maxlength="20" autocomplete="off">

      <h3>2. 나만의 숫자 4자리</h3>
      <p class="sub">기억하기 쉬운 숫자로 정하세요. 처음이면 새로 만들어져요.</p>
      <div class="pin-display" id="pinDisplay"></div>
      <div class="keypad" id="keypad"></div>

      <div class="msg" id="msg"></div>
      <button class="btn btn-primary" id="goBtn">✅ 시작하기</button>
      <button class="btn btn-gray" style="margin-top:12px" onclick="location.href='index.html'">그냥 둘러볼게요</button>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    renderTopbar("내 기록 저장하기", { speakText: "이름과 나만의 숫자 네 자리를 정하면, 어디까지 배웠는지 저장됩니다. 이름을 적고 숫자 네 개를 눌러주세요." });

    let pin = "";
    const pinDisplay = document.getElementById("pinDisplay");
    const msg = document.getElementById("msg");

    function drawPin() {
      pinDisplay.innerHTML = [0, 1, 2, 3].map(i =>
        `<div class="pin-dot ${i < pin.length ? "filled" : ""}">${i < pin.length ? pin[i] : ""}</div>`).join("");
    }
    drawPin();

    const keypad = document.getElementById("keypad");
    ["1","2","3","4","5","6","7","8","9","지우기","0","모두 지우기"].forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      if (k === "지우기" || k === "모두 지우기") b.className = "del";
      b.onclick = () => {
        if (k === "지우기") pin = pin.slice(0, -1);
        else if (k === "모두 지우기") pin = "";
        else if (pin.length < 4) pin += k;
        drawPin();
        msg.textContent = "";
      };
      keypad.appendChild(b);
    });

    document.getElementById("goBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      if (!name) { msg.className = "msg err"; msg.textContent = "이름을 적어주세요."; Speaker.speak("이름을 적어주세요."); return; }
      if (pin.length !== 4) { msg.className = "msg err"; msg.textContent = "숫자 4자리를 눌러주세요."; Speaker.speak("숫자 네 자리를 눌러주세요."); return; }
      msg.className = "msg"; msg.textContent = "확인하는 중이에요…";
      try {
        const data = await Auth.login(name, pin);
        msg.className = "msg ok";
        msg.textContent = data.created ? `${data.name}님, 반가워요! 새로 만들었어요.` : `${data.name}님, 다시 오셨네요!`;
        Speaker.speak(msg.textContent);
        setTimeout(() => location.href = "index.html", 1200);
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = e.message;
        Speaker.speak(e.message);
        pin = ""; drawPin();
      }
    };
  </script>
</body>
</html>
