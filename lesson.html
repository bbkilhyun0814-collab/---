<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강좌 - 스마트폰 AI 배움터</title>
  <meta name="description" content="어르신을 위한 스마트폰 강좌. 휴대폰 화면 그림을 보며 한 단계씩 따라 하고 읽어주기로 들을 수 있어요.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://silver-ai-school.onrender.com/lesson.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="어르신을 위한 스마트폰 AI 배움터">
  <meta property="og:title" content="강좌 - 스마트폰 AI 배움터">
  <meta property="og:description" content="어르신을 위한 스마트폰 강좌. 휴대폰 화면 그림을 보며 한 단계씩 따라 하고 읽어주기로 들을 수 있어요.">
  <meta property="og:url" content="https://silver-ai-school.onrender.com/lesson.html">
  <meta property="og:image" content="https://silver-ai-school.onrender.com/images/og.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar"></header>

  <main class="container">
    <div class="step-indicator" id="stepIndicator"></div>
    <div class="step-bar"><div id="stepBarFill" style="width:0%"></div></div>

    <div class="card" id="stepCard"></div>

    <div class="btn-row">
      <button class="btn btn-gray" id="prevBtn">◀ 이전</button>
      <button class="btn btn-primary" id="nextBtn">다음 ▶</button>
    </div>

    <button class="btn btn-outline" style="margin-top:14px" onclick="speakStep()">🔊 이 단계 읽어주기</button>
  </main>

  <script src="js/common.js"></script>
  <script src="js/lessons-data.js"></script>
  <script src="js/phone-scene.js"></script>
  <script src="js/lesson-scenes.js"></script>
  <script>
    const lesson = getLesson(getParam("id"));
    if (!lesson) {
      alert("강좌를 찾을 수 없습니다. 처음 화면으로 돌아갑니다.");
      location.href = "index.html";
    }

    // 검색엔진·카톡 미리보기용: 강좌 이름을 제목과 설명에 넣음
    setPageMeta(lesson.title + " - 스마트폰 AI 배움터", lesson.desc + " 어르신을 위한 단계별 스마트폰 강좌.", "lesson.html?id=" + lesson.id);

    let current = Progress.get(lesson.id).step || 0;
    if (current >= lesson.steps.length) current = 0;

    renderTopbar(lesson.title, { speakText: () => stepText() });

    function stepText() {
      const s = lesson.steps[current];
      return `${current + 1}단계. ${s.title}. ${s.text} ${s.tip ? "도움말. " + s.tip : ""}`;
    }
    function speakStep() { Speaker.speak(stepText()); }

    function render() {
      const s = lesson.steps[current];
      const total = lesson.steps.length;
      document.getElementById("stepIndicator").textContent = `${total}단계 중 ${current + 1}단계`;
      document.getElementById("stepBarFill").style.width = `${((current + 1) / total) * 100}%`;
      // 그림: 실제 사진 > 휴대폰 화면 그림 > 이모지 순서로 표시
      const scene = getScene(lesson.id, current);
      let visualHtml = `<div class="step-visual">${s.visual}</div>`;
      if (scene && scene.image) {
        visualHtml = `<div class="step-image"><img src="${scene.image}" alt="${s.title}"></div>`;
      } else if (scene) {
        const svg = PhoneScene.render(scene);
        if (svg) visualHtml = `<div class="step-phone">${svg}</div>`;
      }
      document.getElementById("stepCard").innerHTML = `
        ${visualHtml}
        <p class="step-title">${s.title}</p>
        <p class="step-text">${s.text}</p>
        ${s.tip ? `<div class="tip">💡 ${s.tip}</div>` : ""}
      `;
      document.getElementById("prevBtn").disabled = current === 0;
      const next = document.getElementById("nextBtn");
      if (current === total - 1) {
        next.textContent = "✅ 다 배웠어요! 연습하러 가기";
        next.className = "btn btn-green";
      } else {
        next.textContent = "다음 ▶";
        next.className = "btn btn-primary";
      }
      Progress.setStep(lesson.id, current);
      window.scrollTo({ top: 0, behavior: "smooth" });
      Speaker.stop();
    }

    document.getElementById("prevBtn").onclick = () => { if (current > 0) { current--; render(); } };
    document.getElementById("nextBtn").onclick = () => {
      if (current < lesson.steps.length - 1) { current++; render(); }
      else {
        Progress.markDone(lesson.id);
        location.href = `quiz.html?id=${lesson.id}`;
      }
    };

    render();
  </script>
</body>
</html>
